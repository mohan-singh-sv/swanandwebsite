[build]
  command = "npm run build"
  publish = "dist"

# Browser calls stay on this site. Netlify forwards them to the API,
# so the API does not need to allow the Netlify origin.
[[redirects]]
  from = "/api/*"
  to = "https://stagingswanand.oryxretail.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
